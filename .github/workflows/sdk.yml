name: Teste SDK macOS 26
on:
  push:
    branches: [teste-sdk]
jobs:
  sdk:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26-intel, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - run: |
          sw_vers; uname -m
          ls /Applications | grep -i xcode || true
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          swift --version
