name: Teste SDK macOS 26
on:
  push:
    branches: [teste-sdk]
jobs:
  build:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - name: Testar o ajudante
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1); sudo xcode-select -s "$X"
          mkdir ilha && unzip -q teste26.dat -d ilha && cd ilha
          swift build -c release --arch x86_64 --product LumeLocal 2>&1 | grep -E "error|warning: .*LumeLocal|Linking" || true
          H="$(swift build -c release --arch x86_64 --show-bin-path)/LumeLocal"
          "$H" status || true
          say -v Luciana -o fala.aiff "Oi Lume, toca uma música bem linda e marca reunião amanhã às três da tarde."
          afconvert -f WAVE -d LEI16@16000 -c 1 fala.aiff fala.wav
          ls -la fala.wav
          for i in 1 2; do
            start=$(date +%s); "$H" transcrever "$PWD/fala.wav" && echo "ok em $(( $(date +%s) - start ))s" || echo "falhou: $?"
          done
          echo "Quanto é dois mais dois?" | "$H" responder "Responda curto." || echo "modelo: $?"
