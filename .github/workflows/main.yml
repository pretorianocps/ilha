name: Gerar DMG da Ilha

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Extrair o código da Ilha
        run: |
          rm -rf ilha
          mkdir ilha
          unzip -q codigo-ilha.dat -d ilha
          ls -R ilha

      - name: Compilar e gerar o DMG
        run: |
          cd ilha
          swift --version
          chmod +x scripts/build-dmg.sh
          ./scripts/build-dmg.sh

      - name: Disponibilizar o DMG para download
        uses: actions/upload-artifact@v4
        with:
          name: Ilha-dmg
          path: ilha/dist/Ilha.dmg
