name: Gerar DMG da Ilha

on:
  push:
  workflow_dispatch:

# Permite publicar a versão nova (o Lume se atualiza sozinho a partir dela).
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Usar o Xcode mais novo (SDK do macOS 26 para o vidro líquido e a IA no Mac)
        run: |
          X=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version | head -1; xcrun --sdk macosx --show-sdk-version

      - name: Extrair o código mais recente
        run: |
          ARQ=$(for f in *.dat; do echo "$(git log -1 --format=%ct -- "$f") $f"; done | sort -n | tail -1 | cut -d' ' -f2-)
          echo "Usando: $ARQ"
          rm -rf ilha
          mkdir ilha
          unzip -q "$ARQ" -d ilha
          grep -A1 CFBundleShortVersionString ilha/Resources/Info.plist

      - name: Compilar e gerar o DMG
        env:
          # Senha do certificado do Lume: assinatura fixa, para o macOS não pedir as permissões de novo.
          LUME_CERT_PASSWORD: ${{ secrets.LUME_CERT_PASSWORD }}
          # Assinatura oficial da Apple (opcional): quando existirem, o DMG sai assinado e notarizado.
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          cd ilha
          chmod +x scripts/*.sh
          ./scripts/build-dmg.sh

      - name: Disponibilizar o DMG para download
        uses: actions/upload-artifact@v4
        with:
          name: Ilha-dmg
          path: ilha/dist/Ilha.dmg

      - name: Publicar a versão (atualização automática)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ilha
          ./scripts/publish-release.sh
